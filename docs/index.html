<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NRSC Clips</title><meta name="theme-color" content="#111">
<link rel="stylesheet" href="styles.css?v=2">
</head><body>
<header><h1>NRSC Clips</h1><span id="who"></span></header>
<main>
<section class="card">
  <h2>1. Paste the YouTube link</h2>
  <div class="row"><input id="url" type="url" inputmode="url" placeholder="https://youtube.com/live/… or watch?v=…"><button id="load">Load</button></div>
  <p id="url-msg" class="msg"></p>
</section>

<section class="card" id="s-mark" hidden>
  <h2>2. Mark your clips</h2>
  <div class="player"><div id="yt"></div></div>
  <div class="now">Now at <b id="now">0:00</b></div>
  <div class="row nudge"><button data-seek="-10">−10s</button><button data-seek="-1">−1s</button><button id="pp">▶︎ / ❚❚</button><button data-seek="1">+1s</button><button data-seek="10">+10s</button></div>
  <div class="row big"><button id="m-start" class="go">Mark start</button><button id="m-end" class="stop">Mark end</button></div>
  <p class="msg" id="pending"></p>
  <ol id="clips"></ol>
</section>

<section class="card" id="s-out" hidden>
  <h2>3. Shape &amp; make</h2>
  <label>Format</label>
  <div class="seg" id="fmt"><button data-v="vertical" class="on">Vertical 9:16 (Shorts/Reels)</button><button data-v="wide">Wide 16:9</button></div>
  <div id="style-wrap"><label>Vertical style</label>
  <div class="seg" id="style"><button data-v="blur" class="on">Blurred background</button><button data-v="crop">Crop to centre</button></div></div>
  <label for="title">Caption on video (optional)</label>
  <input id="title" maxlength="70" placeholder="e.g. Faith that moves mountains">
  <label class="chk"><input type="checkbox" id="join" checked> Also join all clips into one highlight video</label>
  <label for="name">Your name</label><input id="name" maxlength="30" placeholder="Editor">
  <button id="make" class="primary">Make clips</button>
  <p id="make-msg" class="msg"></p>
</section>

<section class="card">
  <h2>Your videos</h2>
  <div id="jobs"><p class="msg">Nothing made yet.</p></div>
</section>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=2"></script>
</body></html>
